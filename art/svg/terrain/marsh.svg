  <use href="#p" transform="translate(150 140) scale(1.15)"/>
  <use href="#p" transform="translate(40 150) scale(0.6)"/>
  <use href="#p" transform="translate(226 150) scale(0.55)"/>
  <!-- Grasbüschel -->
  <g stroke-linecap="round" stroke-width="2" fill="none">
    <g stroke="#87a672"><path d="M40 60 l3 -8 l3 8"/><path d="M124 40 l3 -8 l3 8"/><path d="M200 110 l3 -8 l3 8"/><path d="M100 170 l3 -8 l3 8"/></g>
    <g stroke="#4f6a3f"><path d="M60 120 l3 -7 l3 7"/><path d="M140 96 l3 -7 l3 7"/><path d="M216 40 l3 -7 l3 7"/><path d="M20 100 l3 -7 l3 7"/></g>

      <path d="M-8 -1 q4 -2 8 0" stroke="#bfe0e8" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- Sumpf: dunkles Feuchtgras, Wasserlachen, Schilf -->

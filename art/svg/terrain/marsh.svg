      <path d="M-2 0 q-1 -10 -1 -18" fill="none" stroke="#87a672" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="-0.3" y="-27" width="3" height="8" rx="1.5" fill="#6e4a2a"/>
    </g>
    <g id="p">

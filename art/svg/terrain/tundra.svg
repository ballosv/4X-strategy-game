    <ellipse cx="196" cy="94" rx="9" ry="4"/>
  </g>
  <!-- Flechten (rostrot) -->
  <g fill="#a87f5a" opacity="0.55"><ellipse cx="106" cy="88" rx="8" ry="3.5"/><ellipse cx="34" cy="70" rx="6" ry="2.6"/><ellipse cx="222" cy="150" rx="7" ry="3"/></g>
  <!-- niedrige Halme -->
  <g stroke-width="1.8">
    <g stroke="#b8c2a6"><use href="#t" x="40" y="100"/><use href="#t" x="122" y="40"/><use href="#t" x="176" y="120"/><use href="#t" x="90" y="152"/><use href="#t" x="220" y="60"/></g>
    <g stroke="#748062"><use href="#t" x="60" y="80"/><use href="#t" x="160" y="84"/><use href="#t" x="30" y="150"/><use href="#t" x="206" y="172"/><use href="#t" x="132" y="124"/></g>
  </g>
  <!-- Steine -->
  <g>
    <ellipse cx="96" cy="60" rx="6" ry="3.6" fill="#6b645c"/><ellipse cx="94.5" cy="58.5" rx="4.4" ry="2.4" fill="#9c958b"/>
    <ellipse cx="170" cy="152" rx="5" ry="3" fill="#6b645c"/><ellipse cx="169" cy="151" rx="3.6" ry="2" fill="#9c958b"/>
    <ellipse cx="140" cy="104" rx="3.4" ry="2" fill="#6b645c"/><ellipse cx="139.5" cy="103.4" rx="2.4" ry="1.3" fill="#cfc8be"/>

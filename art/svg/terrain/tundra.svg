    <path id="t" d="M-3 0 l1.5 -6 M0 0 l0 -7 M3 0 l-1.5 -6" fill="none" stroke-linecap="round"/>
  </defs>
  <!-- Tundra: graugrüner Boden mit Moos, Flechten, Steinen und Schneeresten -->

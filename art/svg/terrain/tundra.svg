  <ellipse cx="62" cy="48" rx="56" ry="28" fill="#a9b294" opacity="0.7"/>
  <ellipse cx="188" cy="138" rx="60" ry="30" fill="#8a9476" opacity="0.6"/>
  <!-- Moospolster -->
  <g fill="#7f8f5c" opacity="0.8">
    <ellipse cx="150" cy="54" rx="22" ry="9"/><ellipse cx="70" cy="128" rx="26" ry="10"/>
    <ellipse cx="200" cy="96" rx="16" ry="7"/><ellipse cx="112" cy="166" rx="18" ry="7"/>
  </g>
  <g fill="#94a46c" opacity="0.8">

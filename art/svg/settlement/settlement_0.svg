<svg xmlns="http://www.w3.org/2000/svg" width="256" height="320" viewBox="0 0 256 320" data-anchor-y="0.7">
  <defs>
    <!-- @defs -->
    <linearGradient id="daub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d2a8"/><stop offset="0.55" stop-color="#c9ad80"/><stop offset="1" stop-color="#8f7350"/>
    </linearGradient>
    <linearGradient id="thatch" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ecd08a"/><stop offset="0.5" stop-color="#c49a52"/><stop offset="1" stop-color="#86622e"/>
    </linearGradient>
    <!-- Rundhütte mit Reetdach (Ursprung = Mitte der Grundfläche) -->
    <g id="hut">
      <ellipse cx="9" cy="4" rx="30" ry="10" fill="url(#shadow)"/>
      <path d="M-18 -16 L-18 0 A18 6 0 0 0 18 0 L18 -16 Z" fill="url(#daub)"/>
      <path d="M-9 4 L-9 -9 Q-4 -15 1 -9 L1 5.5 Z" fill="#3e2a18"/>
      <path d="M-25 -14 Q0 -4 25 -14 L0 -50 Z" fill="url(#thatch)" stroke="#6e4f24" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-25 -14 Q0 -4 25 -14 Q0 -9 -25 -14 Z" fill="#6e4f24"/>
      <path d="M-14 -12 L-3 -40 M-4 -10 L-1 -44 M7 -10 L2 -42 M16 -12 L4 -38" stroke="#86622e" stroke-width="1.3" opacity="0.55"/>
      <path d="M-17 -24 Q0 -18 17 -24" stroke="#86622e" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M-4 -47 L0 -56 L4 -47 Z" fill="#86622e"/>
    </g>
    <!-- Flechtzaun-Element -->
    <g id="fence">
      <path d="M0 0 L0 -12 M10 4 L10 -8 M20 8 L20 -4" stroke="#553c22" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-1 -9 L21 -1 M-1 -4 L21 4" stroke="#9a7348" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- Dorfplatz und Wege -->
  <ellipse cx="128" cy="228" rx="98" ry="62" fill="#7d6a44" opacity="0.4"/>
  <ellipse cx="126" cy="230" rx="44" ry="24" fill="#c2a476" opacity="0.65"/>
  <path d="M126 236 Q90 262 64 296 M130 232 Q178 252 210 270 M126 228 Q124 190 128 150" stroke="#c2a476" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- hintere Reihe -->
  <use href="#hut" transform="translate(86 186) scale(1.05)"/>
  <use href="#hut" transform="translate(168 180) scale(1.05)"/>
  <!-- Garten mit Zaun -->
  <path d="M196 214 L228 226 L214 240 L182 228 Z" fill="#6b5536" opacity="0.7"/>
  <path d="M192 220 L222 231 M188 225 L218 236" stroke="#5f8f33" stroke-width="3" stroke-dasharray="3 3"/>
  <use href="#fence" transform="translate(180 220)"/>
  <use href="#fence" transform="translate(202 228)"/>
  <!-- Mitte: Feuerstelle und Holzstapel -->
  <ellipse cx="126" cy="230" rx="9" ry="4.5" fill="#6b645c"/>
  <path d="M121 230 Q122 220 126 216 Q130 222 132 230 Z" fill="#f08a2e"/>
  <path d="M124 230 Q125 224 127 221 Q129 226 130 230 Z" fill="#ffd25a"/>
  <circle cx="130" cy="206" r="5" fill="#e3e7ea" opacity="0.35"/>
  <circle cx="134" cy="194" r="7" fill="#e3e7ea" opacity="0.22"/>
  <!-- mittlere Reihe -->
  <use href="#hut" transform="translate(46 238)"/>
  <use href="#hut" transform="translate(206 266)"/>
  <!-- Holzstapel -->
  <g transform="translate(152 240)">
    <ellipse cx="6" cy="2" rx="16" ry="5" fill="url(#shadow)"/>
    <path d="M-12 0 L10 0 L10 -8 L-12 -8 Z" fill="#7a5a36"/>
    <circle cx="10" cy="-2" r="3" fill="#d4b088"/><circle cx="10" cy="-7" r="3" fill="#c49a6c"/><circle cx="5" cy="-11" r="3" fill="#d4b088"/>
  </g>
  <!-- vordere Reihe -->
  <use href="#hut" transform="translate(100 288) scale(1.1)"/>
  <use href="#hut" transform="translate(158 296) scale(0.95)"/>
  <use href="#fence" transform="translate(30 262) scale(0.9)"/>
</svg>
